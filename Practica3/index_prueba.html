<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cafetería</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5efe7;
        }

        header {
            background-color: #6f4e37;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2em;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-btn {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background-color: #5a3d2b;
            transform: scale(1.05);
        }

        .view {
            display: none;
            padding: 30px;
            min-height: calc(100vh - 180px);
        }

        .active {
            display: block;
        }

        /* Menú cliente */
        .menu-cliente {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .menu-cliente h2 {
            text-align: center;
            color: #6f4e37;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .menu-opciones {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            text-align: left;
            padding-left: 25px;
        }

        .menu-btn:hover {
            background-color: #5a3d2b;
            transform: translateX(10px);
        }

        .btn-volver {
            background-color: #999;
            margin-top: 20px;
            text-align: center;
        }

        .btn-volver:hover {
            background-color: #777;
            transform: none;
        }

        /* Productos */
        .productos-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .producto-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .producto-card:hover {
            transform: translateY(-5px);
        }

        .producto-card h3 {
            color: #6f4e37;
            margin-bottom: 10px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        .stock {
            color: #666;
            margin: 10px 0;
        }

        .badge-promo {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .btn-agregar {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-agregar:hover {
            background-color: #5a3d2b;
        }

        .promo-card {
            border: 2px solid #ff6b35;
            background: #fff8f0;
        }

        .precio-oferta {
            color: #ff6b35;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Pedido */
        .pedido-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .productos-disponibles, .productos-seleccionados {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .item-pedido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn-small {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-finalizar {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-finalizar:hover {
            background-color: #1b5e20;
        }

        .item-seleccionado {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .total {
            margin-top: 15px;
            font-size: 18px;
            text-align: right;
            color: #2e7d32;
        }

        .pedido-lista {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }

        .pedido-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .pedido-total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #6f4e37;
            text-align: right;
            font-size: 18px;
        }

        .sin-resultados {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .seccion-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #6f4e37;
        }

        @media (max-width: 768px) {
            .pedido-container {
                grid-template-columns: 1fr;
            }
            .productos-grid {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1><i class="ti ti-coffee"></i> La Cafetería</h1>
        <p>El mejor café de la ciudad</p>
    </header>

    <nav>
        <button class="nav-btn" onclick="mostrarVista('caja')">
            <i class="ti ti-cash"></i> Caja
        </button>
        <button class="nav-btn" onclick="mostrarVista('cocina')">
            <i class="ti ti-chef-hat"></i> Cocina
        </button>
        <button class="nav-btn" onclick="mostrarVista('cliente')">
            <i class="ti ti-user"></i> Cliente
        </button>
    </nav>

    <!-- Módulo Caja -->
    <div id="view-caja" class="view">
        <div class="menu-cliente">
            <h2><i class="ti ti-cash"></i> Módulo Caja</h2>
            <p style="text-align:center; padding:40px;">Próximamente: Gestión de pagos y ventas</p>
        </div>
    </div>

    <!-- Módulo Cocina -->
    <div id="view-cocina" class="view">
        <div class="menu-cliente">
            <h2><i class="ti ti-chef-hat"></i> Módulo Cocina</h2>
            <p style="text-align:center; padding:40px;">Próximamente: Gestión de inventario y producción</p>
        </div>
    </div>

    <!-- Módulo Cliente -->
    <div id="view-cliente" class="view active">
        
        <!-- Menú Principal -->
        <div id="menu-principal" class="menu-cliente">
            <h2> ==== CLIENTE ====</h2>
            <div class="menu-opciones">
                <button class="menu-btn" onclick="verProductos()">
                    1 - Ver productos
                </button>
                <button class="menu-btn" onclick="hacerPedido()">
                    2 - Hacer pedido
                </button>
                <button class="menu-btn" onclick="verPedidos()">
                    3 - Ver pedidos
                </button>
                <button class="menu-btn" onclick="verPromociones()">
                    4 -Ver promociones
                </button>
                <button class="menu-btn" onclick="mostrarVista('caja')">
                    5 - Salir (Ir a Caja)
                </button>
            </div>
        </div>

        <!-- Sección Ver Productos -->
        <div id="seccion-productos" style="display:none;">
            <div class="seccion-titulo">
                <h2><i class="ti ti-coffee"></i> Productos Disponibles</h2>
                <button class="btn-small" onclick="mostrarMenuPrincipal()">⬅ Volver al menú</button>
            </div>
            <div id="contenido-productos" class="productos-grid"></div>
        </div>

        <!-- Sección Promociones -->
        <div id="seccion-promociones" style="display:none;">
            <div class="seccion-titulo">
                <h2><i class="ti ti-flame"></i> Promociones</h2>
                <button class="btn-small" onclick="mostrarMenuPrincipal()">⬅ Volver al menú</button>
            </div>
            <div id="contenido-promociones" class="productos-grid"></div>
        </div>

        <!-- Sección Hacer Pedido -->
        <div id="seccion-pedido" style="display:none;">
            <div class="seccion-titulo">
                <h2><i class="ti ti-shopping-cart"></i> Hacer Pedido</h2>
                <button class="btn-small" onclick="mostrarMenuPrincipal()">⬅ Volver al menú</button>
            </div>
            <div class="pedido-container">
                <div class="productos-disponibles">
                    <h3>Productos disponibles</h3>
                    <div id="lista-productos-pedido"></div>
                </div>
                <div class="productos-seleccionados">
                    <h3>Tu pedido actual</h3>
                    <div id="productos-seleccionados"></div>
                </div>
            </div>
        </div>

        <!-- Sección Ver Pedidos -->
        <div id="seccion-lista-pedidos" style="display:none;">
            <div class="seccion-titulo">
                <h2><i class="ti ti-receipt"></i> Mis Pedidos</h2>
                <button class="btn-small" onclick="mostrarMenuPrincipal()">Volver al menú</button>
            </div>
            <div id="contenido-pedidos"></div>
        </div>

    </div>

    <script src="cliente.js"></script>
</body>

</html>
